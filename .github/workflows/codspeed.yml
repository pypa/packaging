name: CodSpeed

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  codspeed:
    name: CodSpeed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC upload to CodSpeed.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.14"
          cache-suffix: ${{ github.job }}

      - name: Install dependencies
        run: uv sync --no-default-groups --group codspeed

      - name: Run benchmarks
        uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5.6.3
        with:
          mode: simulation
          run: uv run --no-sync python -m pytest benchmarks/codspeed --codspeed
